[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# payout and quoter conformity vectors are generated by tools/*.py
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true
