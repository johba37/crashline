[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# conformity vectors (tools/*.py) are read by tests; Deploy.s.sol writes deployments/<chainid>.json
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read-write", path = "../deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[lint]
# src/ builds without lint findings; tests and scripts aren't linted on build.
# Excluded lints, each reviewed in docs/contracts-review.md:
#   block-timestamp       the product is a schedule of timestamps (fixings, staleness, bands)
#   calls-loop            loops are bounded (N + 2 fixings per advance, MAX_HELD_SERIES in the Desk)
#                         and call only factory clones, their recorder and the quoter
#   reentrancy-events     every state-changing entry point is nonReentrant; events follow
#                         calls to trusted clones or USDG
#   boolean-cst           false positive on tuple returns such as (false, 0)
#   missing-zero-check    initializers are factory-only with non-zero arguments
#   missing-events-*      initializer-only writes (the factory emits SeriesCreated)
ignore = ["test/**", "script/**"]
exclude_lints = [
    "block-timestamp",
    "calls-loop",
    "reentrancy-events",
    "boolean-cst",
    "missing-zero-check",
    "missing-events-arithmetic",
    "missing-events-access-control",
]
