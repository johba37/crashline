[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# conformity vectors (tools/*.py) are read by tests; Deploy.s.sol writes deployments/<chainid>.json
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read-write", path = "../deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true
